<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Card · GEO-AI-001 · U-Net (CNN) — Awase Khirni Syed, Ph.D.</title>
<meta name="description" content="Geospatial AI model card detail — U-Net (CNN) semantic segmentation.">
<meta name="author" content="Awase Khirni Syed">
<style>
/* ============================================================
   THEME — Poster Light (Executive Geospatial)
   ============================================================ */
:root{
  --cream:#F6F1E5;
  --cream-2:#EFE8D5;
  --paper:#FFFFFF;
  --navy:#1B2A4A;
  --navy-deep:#14213D;
  --navy-soft:#2C3E63;
  --gold:#C99A3F;
  --gold-light:#D4A853;
  --gold-pale:#F0E0B8;
  --ink:#1B2A4A;
  --muted:#6B6755;
  --muted-2:#8C866F;
  --red:#8E2A26;
  --green:#3F6B4A;
  --amber:#B07A1E;

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;

  --rule:1.5px solid var(--navy);
  --rule-hair:1px solid rgba(27,42,74,.22);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, rgba(27,42,74,.04) 1px, transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 .4em;letter-spacing:-.015em;line-height:1.15}
p{margin:0 0 1em}
a{color:var(--navy);text-decoration:none;border-bottom:1px solid transparent;transition:.15s}
a:hover{border-bottom-color:var(--gold);color:var(--navy-deep)}
button{font:inherit;cursor:pointer}
::selection{background:var(--gold-pale);color:var(--navy)}

.skip-link{position:absolute;left:-9999px}
.skip-link:focus{left:12px;top:12px;z-index:300;background:var(--navy);color:var(--cream);padding:8px 14px;border-radius:2px}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{
  background:rgba(246,241,229,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:var(--rule);
  position:sticky;top:0;z-index:80;
}
.masthead__inner{
  max-width:1200px;margin:0 auto;
  padding:14px clamp(18px,3vw,38px);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.masthead__eyebrow{
  display:flex;gap:16px;align-items:baseline;
  font-size:10.5px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--navy);
}
.masthead__eyebrow .slash{color:var(--gold)}
.masthead__eyebrow .muted{color:var(--muted-2);font-weight:600}
.masthead__nav{
  display:flex;gap:20px;margin-left:auto;
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.masthead__nav a{color:var(--navy);border-bottom:2px solid transparent;padding-bottom:2px}
.masthead__nav a:hover{border-bottom-color:var(--gold)}
.masthead__brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--serif);font-weight:700;font-size:14px;color:var(--navy);
  padding-left:18px;border-left:1px solid var(--navy);
}
.masthead__crest{
  width:28px;height:28px;border:var(--rule);border-radius:50%;
  display:grid;place-items:center;background:var(--gold-pale);
  font-family:var(--serif);font-weight:800;font-size:12px;
}

/* ============================================================
   SHELL & SECTIONS
   ============================================================ */
.shell{max-width:1200px;margin:0 auto;padding:clamp(28px,4vw,56px) clamp(18px,3vw,38px) 40px}

.sec-label{
  display:flex;align-items:baseline;gap:16px;margin:0 0 24px;
  font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--navy);
}
.sec-label .num{
  font-family:var(--serif);font-size:28px;font-weight:700;color:var(--gold);
  letter-spacing:-.02em;line-height:1;
}
.sec-label .rule{flex:1;height:1px;background:var(--navy);align-self:center;opacity:.3}
.sec-label .hint{
  font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;
  font-size:12.5px;color:var(--muted);text-transform:none;
}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding-bottom:44px;border-bottom:var(--rule);margin-bottom:48px}
.hero__top{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:16px;flex-wrap:wrap;margin-bottom:22px;
}
.hero__id{
  font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:.08em;color:var(--gold);
}
.hero__tier{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 12px;border:var(--rule);border-radius:2px;
}
.hero__tier .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.hero__tier[data-tier="high"]{background:var(--red);color:var(--cream);border-color:var(--red)}
.hero__tier[data-tier="medium"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hero__tier[data-tier="low"]{background:var(--green);color:var(--cream);border-color:var(--green)}

.hero h1{
  font-size:clamp(44px,7.6vw,88px);line-height:.96;letter-spacing:-.03em;
  color:var(--navy);margin:0 0 18px;max-width:16ch;
}
.hero h1 em{font-style:italic;font-weight:400;color:var(--gold)}
.hero__use{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(18px,2vw,23px);line-height:1.45;
  color:var(--navy-soft);max-width:60ch;margin:0;
}

.factstrip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:0;border-top:var(--rule);border-bottom:var(--rule);
  margin-top:34px;
}
.factstrip__item{padding:16px 20px;border-right:1px solid rgba(27,42,74,.15)}
.factstrip__item:last-child{border-right:none}
.factstrip__label{
  font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);display:block;margin-bottom:6px;
}
.factstrip__value{
  font-family:var(--serif);font-size:16px;color:var(--navy);line-height:1.35;font-weight:600;
}

/* ============================================================
   PIPELINE DIAGRAM
   ============================================================ */
.pipeline{
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr;
  gap:0;align-items:stretch;border:var(--rule);
  background:var(--paper);margin-bottom:56px;
}
@media (max-width:820px){
  .pipeline{grid-template-columns:1fr}
  .pipeline__arrow{border-left:none !important;border-top:var(--rule);padding:12px 0 !important}
}
.pipeline__cell{
  padding:22px 22px 24px;
  display:flex;flex-direction:column;gap:6px;justify-content:flex-start;
  position:relative;
}
.pipeline__cell--model{background:var(--navy);color:var(--cream)}
.pipeline__eyebrow{
  font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);
}
.pipeline__cell--model .pipeline__eyebrow{color:var(--gold-light)}
.pipeline__title{
  font-family:var(--serif);font-size:19px;font-weight:700;
  color:var(--navy);letter-spacing:-.01em;line-height:1.2;margin:0;
}
.pipeline__cell--model .pipeline__title{color:var(--cream)}
.pipeline__body{
  font-family:var(--serif);font-size:14px;line-height:1.45;
  color:var(--muted);margin:0;
}
.pipeline__cell--model .pipeline__body{color:#D4C9A8}
.pipeline__arrow{
  display:grid;place-items:center;
  padding:0 18px;border-left:var(--rule);border-right:var(--rule);
  font-family:var(--serif);font-size:22px;color:var(--gold);
  background:var(--cream-2);
}

/* ============================================================
   COMPARISON
   ============================================================ */
.compare{
  display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;
  margin-bottom:56px;
}
@media (max-width:780px){
  .compare{grid-template-columns:1fr;gap:14px}
  .compare__vs{margin:0 auto}
}
.compare__col{background:var(--paper);border:var(--rule)}
.compare__head{
  background:var(--navy);color:var(--cream);
  padding:11px 18px;font-size:10.5px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.compare__head .num{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gold-light);letter-spacing:0}
.compare__head--gold{background:var(--gold);color:var(--navy)}
.compare__head--gold .num{color:var(--navy)}
.compare__body{padding:6px 20px}
.compare__row{padding:14px 0;border-bottom:1px dashed rgba(27,42,74,.24);display:grid;gap:4px}
.compare__row:last-child{border-bottom:none}
.compare__row dt{
  font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);
}
.compare__row dd{
  margin:0;font-family:var(--serif);font-size:15px;color:var(--navy);
  line-height:1.45;overflow-wrap:anywhere;
}
.compare__vs{
  align-self:center;padding:0 20px;
  font-family:var(--serif);font-style:italic;font-weight:700;
  color:var(--gold);font-size:22px;
}

/* ============================================================
   FIELD SECTIONS
   ============================================================ */
.group{margin-bottom:48px}
.group__head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:var(--rule);margin-bottom:20px;
}
.group__title{font-family:var(--serif);font-size:22px;color:var(--navy);margin:0;letter-spacing:-.015em}
.group__desc{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);margin:0;flex:1}
.group__count{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted-2)}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0;border-top:var(--rule);border-left:var(--rule)}
.field{background:var(--paper);border-right:var(--rule);border-bottom:var(--rule);padding:16px 18px}
.field--wide{grid-column:1/-1}
.field dt{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;display:block}
.field dd{margin:0;font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--navy);overflow-wrap:anywhere}

/* ============================================================
   RISK BANNER
   ============================================================ */
.riskbanner{
  border:var(--rule);background:var(--paper);
  display:grid;grid-template-columns:auto 1fr;
  margin-bottom:24px;overflow:hidden;
}
.riskbanner__stripe{width:6px;background:var(--gold)}
.riskbanner[data-tier="high"] .riskbanner__stripe{background:var(--red)}
.riskbanner[data-tier="low"] .riskbanner__stripe{background:var(--green)}
.riskbanner__body{padding:16px 22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:680px){.riskbanner__body{grid-template-columns:1fr}}
.riskbanner__col dt{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.riskbanner__col dd{margin:0;font-family:var(--serif);font-size:15px;color:var(--navy);line-height:1.45}

/* ============================================================
   CODE TABS
   ============================================================ */
.code-section{margin-bottom:56px}
.tabs{margin-top:0}
.tablist{display:flex;gap:0;border-bottom:var(--rule);background:var(--paper);flex-wrap:wrap}
.tab{
  appearance:none;font:inherit;font-family:var(--sans);
  font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--paper);color:var(--muted);
  border:none;border-right:var(--rule);
  padding:12px 18px;transition:.15s ease;
  display:inline-flex;align-items:center;gap:8px;
}
.tab:hover{background:#FBF7EC;color:var(--navy)}
.tab[aria-selected="true"]{background:var(--navy);color:var(--cream)}
.tab__dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.tab[data-lang="python"] .tab__dot{background:#FFD43B;opacity:1}
.tab[data-lang="java"]   .tab__dot{background:#F89820;opacity:1}
.tab[data-lang="go"]     .tab__dot{background:#00ADD8;opacity:1}
.tab[data-lang="rust"]   .tab__dot{background:#DEA584;opacity:1}
.tab[data-lang="scala"]  .tab__dot{background:#DC322F;opacity:1}
.tab[aria-selected="true"] .tab__dot{background:currentColor;opacity:.85}

.tabpanel{display:none}
.tabpanel[data-active="true"]{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.code-wrap{background:var(--navy-deep);border:var(--rule);border-top:none}
.code-head{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px 16px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.code-head__file{font-family:var(--mono);font-size:11.5px;color:var(--gold-light);letter-spacing:.04em}
.code-head__meta{display:flex;align-items:center;gap:10px}
.code-head__tag{
  font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cream);opacity:.6;
  border:1px solid rgba(232,226,208,.3);padding:3px 8px;border-radius:2px;
}
.copy-btn{
  appearance:none;font:inherit;font-family:var(--sans);
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--cream);
  border:1px solid rgba(232,226,208,.35);border-radius:2px;
  padding:5px 10px;transition:.15s ease;
}
.copy-btn:hover,.copy-btn.is-copied{background:var(--gold);color:var(--navy);border-color:var(--gold)}

pre{
  margin:0;padding:22px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;
  color:#E8E2D0;tab-size:4;
}
pre::-webkit-scrollbar{height:10px}
pre::-webkit-scrollbar-thumb{background:var(--navy-soft);border-radius:5px}

.tok-kw{color:#D4A853;font-weight:600}
.tok-str{color:#A8C4B0}
.tok-cm{color:#6B7794;font-style:italic}
.tok-num{color:#E8B84B}
.tok-fn{color:#9FB6DD}

/* ============================================================
   AUTHOR BLOCK
   ============================================================ */
.author{
  border-top:var(--rule);border-bottom:var(--rule);
  padding:38px 0;margin-bottom:40px;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;
}
@media (max-width:680px){.author{grid-template-columns:1fr}}
.author__avatar{
  width:108px;height:108px;background:var(--gold-pale);
  border:var(--rule);
  display:grid;place-items:center;
  font-family:var(--serif);font-size:32px;font-weight:800;color:var(--navy);
  letter-spacing:-.02em;
}
.author__kicker{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.author h3{font-size:26px;color:var(--navy);margin:0 0 3px;letter-spacing:-.02em}
.author__role{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-soft);margin-bottom:14px}
.author__bio{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--navy-soft);margin:0 0 12px;max-width:78ch}
.author__highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:var(--rule);border-left:var(--rule);margin:18px 0}
.author__hl{padding:12px 14px;border-right:var(--rule);border-bottom:var(--rule);background:var(--paper)}
.author__hl b{display:block;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-bottom:3px;line-height:1}
.author__hl span{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);line-height:1.4;display:block}
.author__links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.author__links a{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;border:var(--rule);border-radius:2px;color:var(--navy);
  background:transparent;transition:.15s ease;
}
.author__links a:hover{background:var(--navy);color:var(--cream)}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{
  max-width:1200px;margin:0 auto;
  padding:24px clamp(18px,3vw,38px) 40px;
  border-top:var(--rule);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--muted);letter-spacing:.02em;
}
.site-footer strong{color:var(--navy)}

/* ============================================================
   MOTION / PRINT
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important}
  html{scroll-behavior:auto}
}
@media print{
  .masthead,.copy-btn,.site-footer,.skip-link{display:none !important}
  body{background:#fff;background-image:none}
  .compare__col,.field,.author__hl,.pipeline{break-inside:avoid}
}
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<!-- ============================ MASTHEAD ============================ -->
<header class="masthead">
  <div class="masthead__inner">
    <div class="masthead__eyebrow">
      <span>GEOSPATIAL AI <span class="slash">/</span> MODEL CARD</span>
      <span class="muted">VOL. 01</span>
    </div>
    <nav class="masthead__nav" aria-label="Primary">
      <a href="#card">Card</a>
      <a href="#code">Code</a>
      <a href="#author">Author</a>
    </nav>
    <div class="masthead__brand">
      <span class="masthead__crest" aria-hidden="true">A</span>
      <span>Awase&nbsp;Khirni&nbsp;Syed</span>
    </div>
  </div>
</header>

<main id="main">
  <div class="shell" id="cardRoot">
    <!-- Dynamically rendered from the CARD object below -->
  </div>
</main>

<footer class="site-footer">
  <span>© <span id="year"></span> Geospatial AI Model Card Registry · Curated by <strong>Awase Khirni Syed, Ph.D.</strong> · CC BY 4.0</span>
  <span>Practitioner reference · Volume 01</span>
</footer>

<script>
(function () {
  "use strict";

  /* =========================================================
     THE MODEL CARD 
     Swap this single object to render any of the 600 cards.
     ========================================================= */
  const CARD = {
    "Id": "GEO-AI-001",
    "AI Algorithm": "U-Net (CNN)",
    "Intended Use": "Semantic Segmentation",
    "Purpose": "Pixel-wise classification for detailed maps",
    "Business Case": "Urban planning, agricultural monitoring",
    "Misuse Risk": "Unauthorized surveillance",
    "Training Data": "Labeled geospatial imagery",
    "Training Data Source": "SpaceNet, DeepGlobe, Maxar, Planet",
    "Data Splits": "60/20/20",
    "Data Formats": "GeoTIFF, JPEG2000, GeoJSON",
    "Performance Metrics": "IoU, Dice Coefficient, Pixel Accuracy",
    "Fairness Evaluation": "Performance across regions (urban vs rural)",
    "Explainability": "Grad-CAM, SHAP",
    "Limitations": "Large labeled data needs, poor generalization",
    "Monitoring Plan": "Track IoU drift on reference data",
    "KPIs Tracked": "Mean IoU, Inference Time",
    "Compliance Alignment": "GDPR, CCPA",
    "Input": "High-res satellite image (e.g., RGBNir)",
    "Output": "Raster classification map"
  };

  /* =========================================================
     Helpers
     ========================================================= */
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const escapeHtml = str => String(str == null ? "" : str).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));

  /* =========================================================
     Risk tier
     ========================================================= */
  const HIGH_RE   = /(high|military|misinformation|ethical review|targeting|weapon)/i;
  const MEDIUM_RE = /(medium|bias|privacy|surveillance|tracking|stigma|equity|gerrymander)/i;

  function riskTier(card) {
    const blob = `${card["Misuse Risk"] || ""} ${card["Compliance Alignment"] || ""}`;
    if (HIGH_RE.test(blob))   return "high";
    if (MEDIUM_RE.test(blob)) return "medium";
    return "low";
  }
  const TIER_LABEL = { high:"High risk", medium:"Medium risk", low:"Low risk" };

  /* =========================================================
     Section renderers
     ========================================================= */
  function renderHero(card) {
    const tier = riskTier(card);
    return `
      <section class="hero" id="card">
        <div class="hero__top">
          <span class="hero__id">${escapeHtml(card["Id"])}</span>
          <span class="hero__tier" data-tier="${tier}">
            <span class="dot" aria-hidden="true"></span>
            ${TIER_LABEL[tier]}
          </span>
        </div>
        <h1>${escapeHtml(card["AI Algorithm"] || "Untitled")}</h1>
        <p class="hero__use">
          ${escapeHtml(card["Intended Use"] || "")}
          <em style="color:var(--muted)">— ${escapeHtml(card["Purpose"] || "")}</em>
        </p>
        <div class="factstrip">

import json
from dataclasses import dataclass
from typing import List

HIGH_RISK_TERMS = ("high", "military", "surveillance", "misinformation", "targeting")

@dataclass(frozen=True)
class ModelCard:
    id: str
    algorithm: str
    intended_use: str
    business_case: str
    misuse_risk: str
    compliance: str

    @classmethod
    def from_dict(cls, row: dict) -> "ModelCard":
        return cls(
            id=row["Id"],
            algorithm=row["AI Algorithm"],
            intended_use=row["Intended Use"],
            business_case=row["Business Case"],
            misuse_risk=row["Misuse Risk"],
            compliance=row["Compliance Alignment"],
        )

    def is_high_risk(self) -> bool:
        blob = f"{self.misuse_risk} {self.compliance}".lower()
        return any(t in blob for t in HIGH_RISK_TERMS)

def load(path: str = "model_cards.json") -> List[ModelCard]:
    with open(path, encoding="utf-8") as fh:
        return [ModelCard.from_dict(r) for r in json.load(fh)]

if __name__ == "__main__":
    cards = load()
    flagged = [c for c in cards if c.is_high_risk()]
    print(f"{len(cards)} cards loaded, {len(flagged)} flagged for review")

import (
	"encoding/json"
	"fmt"
	"os"
	"strings"
)

type ModelCard struct {
	ID           string `json:"Id"`
	Algorithm    string `json:"AI Algorithm"`
	IntendedUse  string `json:"Intended Use"`
	BusinessCase string `json:"Business Case"`
	MisuseRisk   string `json:"Misuse Risk"`
	Compliance   string `json:"Compliance Alignment"`
}

var highRiskTerms = []string{"high", "military", "surveillance", "misinformation", "targeting"}

func (m ModelCard) IsHighRisk() bool {
	blob := strings.ToLower(m.MisuseRisk + " " + m.Compliance)
	for _, t := range highRiskTerms {
		if strings.Contains(blob, t) {
			return true
		}
	}
	return false
}

func Load(path string) ([]ModelCard, error) {
	raw, err := os.ReadFile(path)
	if err != nil {
		return nil, fmt.Errorf("read %s: %w", path, err)
	}
	var cards []ModelCard
	if err := json.Unmarshal(raw, &cards); err != nil {
		return nil, fmt.Errorf("decode %s: %w", path, err)
	}
	return cards, nil
}

func main() {
	cards, err := Load("model_cards.json")
	if err != nil {
		panic(err)
	}
	flagged := 0
	for _, c := range cards {
		if c.IsHighRisk() {
			flagged++
			fmt.Printf("  %-12s %-28s %s\n", c.ID, c.Algorithm, c.MisuseRisk)
		}
	}
	fmt.Printf("%d cards loaded, %d flagged for review\n", len(cards), flagged)
}

<pre><code data-lang="rust">use serde::{Deserialize, Serialize};
use std::fs::File;
use std::io::{self, BufReader};

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct ModelCard {
    #[serde(rename = "Id")]
    pub id: String,
    #[serde(rename = "AI Algorithm")]
    pub algorithm: String,
    #[serde(rename = "Intended Use")]
    pub intended_use: String,
    #[serde(rename = "Business Case")]
    pub business_case: String,
    #[serde(rename = "Misuse Risk")]
    pub misuse_risk: String,
    #[serde(rename = "Compliance Alignment")]
    pub compliance: String,
}

const HIGH_RISK_TERMS: [&str; 5] = [
    "high", "military", "surveillance", "misinformation", "targeting",
];

impl ModelCard {
    pub fn is_high_risk(&self) -> bool {
        let blob = format!("{} {}", self.misuse_risk, self.compliance).to_lowercase();
        HIGH_RISK_TERMS.iter().any(|t| blob.contains(t))
    }
}

pub fn load(path: &str) -> io::Result<Vec<ModelCard>> {
    let file = File::open(path)?;
    serde_json::from_reader(BufReader::new(file))
        .map_err(|e| io::Error::new(io::ErrorKind::InvalidData, e))
}

fn main() -> io::Result<()> {
    let cards = load("model_cards.json")?;
    let flagged: Vec<&ModelCard> = cards.iter().filter(|c| c.is_high_risk()).collect();
    println!("{} cards loaded, {} flagged for review", cards.len(), flagged.len());
    for c in flagged.iter().take(10) {
        println!("  {:<12} {:<28} {}", c.id, c.algorithm, c.misuse_risk);
    }
    Ok(())
}

import io.circe.parser.decode

import scala.util.Using

final case class ModelCard(

)

object ModelCard {
  private val HighRiskTerms =
    List("high", "military", "surveillance", "misinformation", "targeting")

    for {
      id           <- c.get[String]("Id")
      algorithm    <- c.get[String]("AI Algorithm")
      intendedUse  <- c.get[String]("Intended Use")
      businessCase <- c.get[String]("Business Case")
      misuseRisk   <- c.get[String]("Misuse Risk")
      compliance   <- c.get[String]("Compliance Alignment")
    } yield ModelCard(id, algorithm, intendedUse, businessCase, misuseRisk, compliance)
  }

  def isHighRisk(card: ModelCard): Boolean = {
    val blob = s"\${card.misuseRisk} \${card.compliance}".toLowerCase
    HighRiskTerms.exists(blob.contains)
  }

  def load(path: String): Either[String, List[ModelCard]] =
    Using(Source.fromFile(path, "UTF-8")) { src =>
      decode[List[ModelCard]](src.mkString).left.map(_.getMessage)
    }.flatten.toEither.left.map(_.getMessage)
}

  function highlight(code, lang) {
    const kw = KEYWORDS[lang] || new Set();
    const hashComments = lang === "python";
    const n = code.length;
    let out = "", i = 0;
    const isIdStart = c => /[A-Za-z_$]/.test(c);
    const isIdChar  = c => /[A-Za-z0-9_$]/.test(c);

    while (i < n) {
      const c = code[i];
      if ((hashComments && c === "#") || (!hashComments && c === "/" && code[i+1] === "/")) {
        let j = code.indexOf("\n", i); if (j === -1) j = n;
        out += `<span class="tok-cm">${escapeHtml(code.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (c === "/" && code[i+1] === "*") {
        let j = code.indexOf("*/", i+2); j = j === -1 ? n : j+2;
        out += `<span class="tok-cm">${escapeHtml(code.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (hashComments && (code.startsWith('"""', i) || code.startsWith("'''", i))) {
        const q = code.slice(i, i+3);
        let j = code.indexOf(q, i+3); j = j === -1 ? n : j+3;
        out += `<span class="tok-str">${escapeHtml(code.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (c === '"' || c === "'" || c === "`") {
        let j = i + 1;
        while (j < n) {
          if (code[j] === "\\") { j += 2; continue; }
          if (code[j] === c) { j++; break; }
          if (code[j] === "\n" && c !== "`") break;
          j++;
        }
        out += `<span class="tok-str">${escapeHtml(code.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i;
        while (j < n && /[0-9a-fA-FxX._]/.test(code[j])) j++;
        out += `<span class="tok-num">${escapeHtml(code.slice(i, j))}</span>`;
        i = j; continue;
      }
      if (isIdStart(c)) {
        let j = i;
        while (j < n && isIdChar(code[j])) j++;
        const w = code.slice(i, j);
        if (kw.has(w))            out += `<span class="tok-kw">${escapeHtml(w)}</span>`;
        else if (code[j] === "(") out += `<span class="tok-fn">${escapeHtml(w)}</span>`;
        else                      out += escapeHtml(w);
        i = j; continue;
      }
      out += escapeHtml(c);
      i++;
    }
    return out;
  }

  function applyHighlighting() {
    $$("pre code[data-lang]").forEach(el => {
      if (el.dataset.highlighted) return;
      el.innerHTML = highlight(el.textContent, el.dataset.lang);
      el.dataset.highlighted = "1";
    });
  }

  /* =========================================================
     Tabs
     ========================================================= */
  function initTabs() {
    const tabs = $$('.tab[role="tab"]');
    if (!tabs.length) return;

    function select(tab) {
      tabs.forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        const p = document.getElementById(t.getAttribute("aria-controls"));
        if (p) p.dataset.active = String(on);
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => select(tab));
      tab.addEventListener("keydown", e => {
        const idx = tabs.indexOf(tab);
        let next = null;
        if (e.key === "ArrowRight") next = tabs[(idx + 1) % tabs.length];
        else if (e.key === "ArrowLeft") next = tabs[(idx - 1 + tabs.length) % tabs.length];
        else if (e.key === "Home") next = tabs[0];
        else if (e.key === "End") next = tabs[tabs.length - 1];
        else return;
        e.preventDefault();
        select(next);
        next.focus();
      });
    });
  }

  /* =========================================================
     Copy buttons
     ========================================================= */
  function initCopyButtons() {
    $$("[data-copy]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const wrap = btn.closest(".code-wrap");
        const codeEl = wrap && wrap.querySelector("pre code");
        if (!codeEl) return;
        const text = codeEl.textContent;
        try { await navigator.clipboard.writeText(text); }
        catch {
          const ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", "");
          ta.style.position = "fixed"; ta.style.left = "-9999px";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); document.body.removeChild(ta);
        }
        const orig = btn.textContent;
        btn.textContent = "Copied ✓";
        btn.classList.add("is-copied");
        setTimeout(() => { btn.textContent = orig; btn.classList.remove("is-copied"); }, 1500);
      });
    });
  }

  /* =========================================================
     Boot
     ========================================================= */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
})();
</script>
